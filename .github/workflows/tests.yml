name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - name: Run all test suites (offline, no keys)
        run: python -m unittest -v test_condor test_btc_pnl test_collector test_thursday test_bot 2>&1 | tail -5
      - name: Fail on any test failure
        run: python -m unittest test_condor test_btc_pnl test_collector test_thursday test_bot
  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No .env files or Telegram tokens in the repo
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.bak' ; then echo "secret-like file committed"; exit 1; fi
          if git grep -nE '[0-9]{8,10}:[A-Za-z0-9_-]{35}' -- . ':!*.md'; then echo "Telegram-token-like text"; exit 1; fi
